[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shelem-env"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pettingzoo>=1.24",
    "gymnasium>=0.29",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch  = ["torch>=2.0", "stable-baselines3>=2.0"]
render = ["rich>=13.0"]
dev    = ["pytest>=8.0", "pytest-cov", "rich>=13.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shelem*"]
